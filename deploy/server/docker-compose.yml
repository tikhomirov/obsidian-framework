# Obsidian Framework server. Port is published ONLY on the Tailscale address.
name: obsidian-framework
services:
  of-server:
    build:
      context: ${VAULT_DIR:?set VAULT_DIR in .env}/.framework
      dockerfile: deploy/server/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:24-bookworm-slim}
        NODE_TARBALL_VERSION: ${NODE_TARBALL_VERSION:-}
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: obsidian-framework-server:local
    container_name: of-server
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:8787:8787"
    environment:
      OF_TOKENS_FILE: /config/tokens.json
      OF_PARTICIPANTS_FILE: /config/participants.json
      OF_WORKER_SSH_TARGET: ${OF_WORKER_SSH_TARGET:-}
      OF_WORKER_SSH_KEY: /config/worker_ssh_key
      OF_WORKER_SSH_OPTIONS: "-o UserKnownHostsFile=/config/known_hosts -o StrictHostKeyChecking=yes"
      GIT_SSH_COMMAND: "ssh -p ${GIT_SSH_PORT:-22} -i /config/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=/config/known_hosts -o StrictHostKeyChecking=yes"
      OF_CORS_ORIGINS: app://obsidian.md
      OF_POLL_INTERVAL_MS: ${OF_POLL_INTERVAL_MS:-30000}
      OF_AUTOARCHIVE_DAYS: ${OF_AUTOARCHIVE_DAYS:-7}
      TZ: ${TZ:-UTC}
    extra_hosts:
      # git host as seen from the container (Gitea on this host → host-gateway)
      - "${GIT_HOST:-git.example.com}:${GIT_HOST_ADDR:-host-gateway}"
    volumes:
      - ${VAULT_DIR}:/vault
      - ./config:/config:ro
      - of-data:/data
      - ./pi-home:/home/of/.pi
volumes:
  of-data:
